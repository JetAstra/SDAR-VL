# disable_gradient_checkpointing: true
# gradient_checkpointing: true

### dataset
# dataset: mllm_demo,identity,alpaca_en_demo
dataset: R1-Onevision
media_dir: /mnt/shared-storage-user/dllm-share/chengshuang/dataset/R1-Onevision-json
template: sdar_v # qwen2_vl
video_maxlen: 64
block_length: 4
cutoff_len: 16384
truncate_mode: drop # choices: [drop, cut] 多模态推荐 drop
# max_samples: 200
overwrite_cache: false
tokenized_path: /mnt/shared-storage-user/dllm-share/chengshuang/dataset/tokenized_dataset/tokenized_sdar_v_r1_onevision_packlen_16384
preprocessing_num_workers: 96
dataloader_num_workers: 16
neat_packing: true
# streaming: true
# max_steps: 1000

### output
output_dir: /mnt/shared-storage-user/dllm-share/chengshuang/sdar_v_ckpt/sdar_v_4b_p_rectify_scheduler_from_scratch/sdar_v_stage4_1
# output_dir: saves/test
logging_steps: 10
save_steps: 970
save_total_limit: 6
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
run_name: sdar_v_4b_p_rectify_scheduler_from_scratch_stage_4_1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
mm_vision_tower_lr: 2.0e-6
mm_projector_lr: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

