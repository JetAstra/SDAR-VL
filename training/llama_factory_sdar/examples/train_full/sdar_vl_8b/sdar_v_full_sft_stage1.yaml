### model
model_name_or_path: /mnt/shared-storage-user/chengshuang/projects/modelZoo/sdar_v_8b_p_rectify
train_from_scratch: false
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: true
deepspeed: examples/deepspeed/ds_z2_config.json
# disable_gradient_checkpointing: true
# gradient_checkpointing: true

### dataset
dataset: blip_laion_cc_sbu_558k
media_dir: /mnt/shared-storage-user/chengshuang/projects/dataset/LLaVA-Pretrain/images
template: sdar_v #qwen2_vl
block_length: 4
cutoff_len: 8192
truncate_mode: drop # choices: [drop, cut] 多模态推荐 drop
overwrite_cache: false
tokenized_path: /mnt/shared-storage-user/chengshuang/projects/dataset/LLaVA-Pretrain/tokenized_sdar_v_blip_laion_cc_sbu_558k_packlen_8192
preprocessing_num_workers: 96
dataloader_num_workers: 16
neat_packing: true
# streaming: true
# max_steps: 1000

### output
output_dir: /mnt/shared-storage-user/dllm-share/chengshuang/sdar_v_ckpt/sdar_v_8b_p_rectify_scheduler_from_scratch/sdar_v_stage1
# output_dir: saves/test
logging_steps: 10
save_steps: 2000
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
run_name: sdar_v_8b_p_rectify_from_scratch_stage_1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-3
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: true
noise_scheduler_type: beta # uniform, beta
scheduler_warmup_steps: 8090 # 总的 step 数，update x accu
scheduler_target_mean: 0.8
scheduler_start_C: 2.0
scheduler_end_C: 50.0

